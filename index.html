<!DOCTYPE html>
<html lang="en">

<head>
 
    <title>To Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .todo-container {
            width:70vw;
            min-height: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 80px;
            box-shadow: gray;
        }

        .todo-container h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            gap: 5px;
        }

        .input-box input {
            flex: 1;
            padding: 8px;
            outline: none;
        }

        .input-box button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            margin-top: 15px;
        }

        li {
            background: #eee;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
             background-color: gold;
            border-radius: 10px;
            color:white;
        }

        li.done {
            text-decoration: line-through;
            color: gray;
        }

        li button {
            background: red;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 4px 8px;
            cursor: pointer;
        }
        #btn {
        background-color: gold;
        border-radius: 10px;
        outline: none;
        border: none;
        }
        .list-container{
             margin-top: 20px;
             list-style: none;
        }
     
    </style>
</head>

<body>

    <div class="todo-container">
        <h2>To Do List</h2>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter task">
            <button id="btn">Add</button>
        </div>

        <ul id="list-container">
         <!-- <li>item 1</li> -->
        </ul>
    </div>

    
</body>
<script>
       var inp = document.querySelector(".input-box input");
       var btn = document.querySelector("#btn");
       var list = document.querySelector("#list-container");

       function addToDo(){
         var value = inp.value.trim();
         if (value == "") {
             alert ("Empty Input");
             return;
         }


         var li = document.createElement("li");
        li.innerHTML = `${value} <button class = "deletebtn"> Delete </button>`;

        li.querySelector(".deletebtn").addEventListener(
            "click",
            function(e){
                li.remove();
            }
        )

        list.appendChild(li)
        inp.value = ""
        console.log (list.childElementCount,"childElementCount")
       }
        btn.addEventListener("click", addToDo);

       inp.addEventListener(
       "keyup",
       function(e){
        if (e.key == "Enter"){
            addToDo();
        }
       }

       )

  
</script>
</html>
